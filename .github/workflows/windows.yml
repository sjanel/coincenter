name: Windows

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows:
    name: Build on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        buildmode: [Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No explicit generator: CMake picks the most recent Visual Studio installed on the runner.
      # vcpkg DLLs are not copied next to each executable (VCPKG_APPLOCAL_DEPS=OFF): executables built in parallel in the
      # same directory make these copies fail ('file being used by another process'). They are found from PATH instead.
      - name: Configure CMake with vcpkg
        run: cmake -S . -B build -A x64 -DVCPKG_APPLOCAL_DEPS=OFF
        env:
          CMAKE_BUILD_TYPE: ${{matrix.buildmode}}
          CMAKE_TOOLCHAIN_FILE: "C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{matrix.buildmode}} --parallel 4

      - name: Add vcpkg DLLs directory to PATH
        run: echo "${{github.workspace}}\build\vcpkg_installed\x64-windows\${{ matrix.buildmode == 'Debug' && 'debug\bin' || 'bin' }}" >> $env:GITHUB_PATH

      - name: Tests
        working-directory: ${{github.workspace}}/build
        run: ctest -j 2 -C ${{matrix.buildmode}} --output-on-failure --repeat until-pass:5

      - name: Sanity check main executable
        working-directory: ${{github.workspace}}/build/${{matrix.buildmode}}
        run: .\coincenter.exe --help
