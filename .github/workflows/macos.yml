name: MacOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  xcode:
    name: Build on MacOS
    runs-on: macos-26
    strategy:
      matrix:
        buildmode: [Debug]
    steps:
      - uses: actions/checkout@v7

      # Same toolchain as aeronet macOS CI: GCC 15 (libstdc++), as libc++ is not complete enough yet for aeronet
      # (std::chrono::clock_cast for instance), with an Xcode SDK supported by GCC 15.
      - name: Select GCC 15 toolchain and Xcode 26.2 SDK
        run: |
          DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> $GITHUB_ENV
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV
          echo "SDKROOT=$(DEVELOPER_DIR=${DEVELOPER_DIR} xcrun --sdk macosx26.2 --show-sdk-path)" >> $GITHUB_ENV

      - name: Show selected toolchain
        run: |
          xcodebuild -version
          echo "SDK: ${SDKROOT}"
          $CXX --version

      - name: Configure
        run: cmake -DCCT_ENABLE_ASAN=OFF -DCMAKE_OSX_SYSROOT=$SDKROOT -S . -B build -GNinja
        env:
          CMAKE_BUILD_TYPE: ${{ matrix.buildmode }}

      - name: Build
        run: cmake --build build --config ${{ matrix.buildmode }}

      - name: Tests
        working-directory: ${{github.workspace}}/build
        run: ctest -j 2 --output-on-failure --repeat until-pass:5

      - name: Sanity check main executable
        working-directory: ${{github.workspace}}/build
        run: ./coincenter --help
